<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Age Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <ion-icon name="calendar-outline"></ion-icon>
            <p>Age Calculator</p>
        </div>
        
        <div class="input-group">
            <div class="date-container">
                <label for="birthDate">Date of Birth</label>
                <input type="date" id="birthDate" required>
            </div>
            
            <div class="date-container">
                <label for="currentDate">Age at the Date of</label>
                <input type="date" id="currentDate" required>
            </div>
        </div>

        <div class="button-group" style="display: flex; gap: 10px; width: 100%;">
            <button id="calculateBtn" style="flex: 3;">
                <span>Calculate</span>
                <ion-icon name="rocket-outline"></ion-icon>
            </button>

            <button id="refreshBtn" title="Reset" style="flex: 1;">
                <ion-icon name="refresh-outline"></ion-icon>
            </button>
        </div>

        <div class="result-box">
            <p id="output">Ready to calculate your journey! 🚀✨</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
